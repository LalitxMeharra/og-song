<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d17">
  <title>SongDL — High Quality Audio Player & Downloader</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> SongDL</div>
  <div class="kbps-pill">320 kbps ready</div>
</div>

<div class="wrap">
  <!-- SEARCH VIEW -->
  <div id="searchView">
    <div class="hero">
      <div class="eyebrow"><span class="bar"></span> High Quality Audio <span class="bar"></span></div>
      <h1 class="title">Song Downloader</h1>
      <p class="sub">Search any song to stream and download in lossless 320 kbps.</p>

      <form id="searchForm" class="searchbar">
        <input id="q" type="text" placeholder="Search song, artist, or album..." autocomplete="off" required>
        <button type="submit" class="btn-search" id="searchBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.4"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          Search
        </button>
      </form>
    </div>

    <div id="resultsArea"></div>
  </div>

  <!-- CUSTOM PLAYER VIEW -->
  <div class="player-view" id="playerView">
    <button class="back-btn" id="backBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Search
    </button>

    <div class="player-card">
      <div class="cover-wrapper">
        <img id="coverImg" class="cover-img" src="" alt="Album Art">
        <div class="cover-overlay" id="coverEq">
          <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      </div>

      <h2 class="p-title" id="pTitle">—</h2>
      <p class="p-artist" id="pArtist">—</p>
      <p class="p-album" id="pAlbum">—</p>

      <!-- Custom Player Controls UI -->
      <div class="audio-ui">
        <div class="transport">
          <button class="p-btn" id="rewindBtn" title="-10s">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M11 12H4m0 0l5-5m-5 5l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          
          <button class="p-btn p-play" id="playBtn">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          
          <button class="p-btn" id="fwdBtn" title="+10s">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 12h7m0 0l-5-5m5 5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="seek-wrap">
            <span class="time" id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
            <span class="time right" id="durTime">0:00</span>
          </div>
        </div>

        <div class="lower-row">
          <div class="vol-wrap">
            <button class="more-btn" id="muteBtn">
              <svg id="volIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10v4h4l5 5V5L7 10H3z"/><path d="M16 8a5 5 0 010 8" stroke-linecap="round"/></svg>
            </button>
            <input type="range" id="vol" min="0" max="100" value="85">
          </div>
          
          <select class="speed-select" id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </div>
      </div>

      <!-- Working Download Anchors -->
      <div class="dl-label">⚡ Direct Downloads</div>
      <div class="dl-grid">
        <a id="btn320" class="dl-btn" href="#" target="_blank" rel="noopener noreferrer">
          <span class="dl-kbps">320 kbps</span>
          <span class="dl-tag">Ultra HD</span>
        </a>
        <a id="btn160" class="dl-btn" href="#" target="_blank" rel="noopener noreferrer">
          <span class="dl-kbps">160 kbps</span>
          <span class="dl-tag">High</span>
        </a>
        <a id="btn96" class="dl-btn" href="#" target="_blank" rel="noopener noreferrer">
          <span class="dl-kbps">96 kbps</span>
          <span class="dl-tag">Data Saver</span>
        </a>
      </div>
    </div>

    <!-- Hidden Native Audio Engine -->
    <audio id="audio" preload="none"></audio>
  </div>
</div>

<div class="toast" id="toast"><span class="dot2"></span><span id="toastMsg"></span></div>

<script src="/script.js" defer></script>
</body>
</html>
