<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Song Search & Downloader</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Search View -->
  <main class="app" id="searchView">
    <header>
      <p class="eyebrow">HIGH QUALITY AUDIO</p>
      <h1>Song Downloader</h1>
      <p class="sub">Search any song to play and download in 320 kbps</p>
    </header>

    <form id="searchForm" class="search-box">
      <input id="query" name="q" type="search" placeholder="Search song name..." autocomplete="off" required>
      <button type="submit">Search</button>
    </form>

    <p id="status" class="status" aria-live="polite">Type a song name and search.</p>
    <section id="results" class="results"></section>
  </main>

  <!-- Dedicated Player View -->
  <div id="playerView" class="player-overlay" style="display: none;">
    <div class="player-container">
      <button id="backBtn" class="back-btn">← Back to Search</button>
      
      <div class="player-card">
        <img id="playerCover" class="player-cover" src="" alt="Album Art">
        <h2 id="playerTitle" class="player-title">Song Title</h2>
        <p id="playerArtist" class="player-artist">Artist Name</p>
        <p id="playerAlbum" class="player-album">Album</p>

        <audio id="mainAudio" controls class="audio-element"></audio>

        <div class="download-section">
          <p class="dl-heading">⚡ DIRECT DOWNLOADS</p>
          <div class="dl-buttons">
            <button type="button" class="dl-btn" onclick="openDownloadModal('320')">
              <span>320 kbps</span>
              <small>Ultra HD</small>
            </button>
            <button type="button" class="dl-btn" onclick="openDownloadModal('160')">
              <span>160 kbps</span>
              <small>High</small>
            </button>
            <button type="button" class="dl-btn" onclick="openDownloadModal('96')">
              <span>96 kbps</span>
              <small>Data Saver</small>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Download Confirmation Popup Modal -->
  <div id="downloadModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>Start Download?</h3>
      <p id="modalTrackInfo">Song Name (320 kbps)</p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeDownloadModal()">Cancel</button>
        <a id="modalConfirmBtn" class="btn-confirm" href="#" download>Download Now</a>
      </div>
    </div>
  </div>

  <script src="/script.js" defer></script>
</body>
</html>
